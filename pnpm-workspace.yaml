# Build scripts are denied by default; an unlisted package counts as unreviewed.
# `allowBuilds` is the only spelling pnpm 11 reads: onlyBuiltDependencies,
# neverBuiltDependencies and their siblings were removed in v11 and replaced by
# this map. Without an entry, `pnpm install` exits with ERR_PNPM_IGNORED_BUILDS
# rather than warning.
allowBuilds:
  # Optional native dependency of jest-haste-map, used only to speed up `jest --watch`.
  # Jest falls back to its own polling watcher without it, and no pipeline job runs watch
  # mode — `test:watch` is a developer convenience and nothing in CI calls it — so the
  # native build buys this repo nothing and is denied like any other unreviewed build
  # script. Listed explicitly rather than left out: an absent entry and a denied one behave
  # the same at install time, but only the entry records that the question was asked.
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  unrs-resolver: true

# Forced versions for vulnerable transitive dev dependencies. These live here and
# NOT in package.json: pnpm 11 no longer reads the `pnpm` field of package.json, so
# an override placed there does nothing — it warns, but it does nothing.
overrides:
  'brace-expansion@<5.0.6': '>=5.0.6'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1'
  'postcss@<8.5.10': '>=8.5.10'
  'qs@>=6.11.1 <=6.15.1': '>=6.15.2'
  'sharp@<0.35.0': '>=0.35.0'
  'tmp@<0.2.6': '>=0.2.6'
  'ws@<8.20.1': '>=8.20.1'
