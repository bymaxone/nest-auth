# Build scripts are denied by default; an unlisted package counts as unreviewed.
# `allowBuilds` is the only spelling pnpm 11 reads: onlyBuiltDependencies,
# neverBuiltDependencies and their siblings were removed in v11 and replaced by
# this map. Without an entry, `pnpm install` exits with ERR_PNPM_IGNORED_BUILDS
# rather than warning.
allowBuilds:
  # Deliberately ahead of the lockfile: this tree resolves jest-haste-map@30.4.1, which does
  # not depend on @parcel/watcher at all, so the entry is inert here. It exists because
  # jest-haste-map@30.5.0 adds @parcel/watcher as a direct dependency, and pnpm 11 EXITS on
  # an unlisted build script — without the entry, the next bump of jest cannot install.
  #
  # What the package does when it is present: its native binding serves the file watcher, so
  # it is reached only in watch mode, and nothing in CI runs that — `test:watch` is a
  # developer convenience no workflow calls.
  #
  # Denying costs nothing even for a developer who does use watch mode, because the build
  # script is a no-op under a normal install. `@parcel/watcher@2.6.0` runs
  # `node scripts/build-from-source.js`, whose entire body is:
  #
  #     if (process.env.npm_config_build_from_source === 'true') { build() }
  #
  # Unset, it compiles nothing; the package ships prebuilt binaries per platform. So `true`
  # would not buy a native build here — it would only grant the script permission to act if
  # that gate ever moves. `false` is the entry with an effect, not the cautious half of two
  # real options.
  #
  # Listed explicitly rather than left out: an absent entry and a denied one behave the same
  # at install time, but only the entry records that the question was asked.
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  unrs-resolver: true

# Forced versions for vulnerable transitive dev dependencies. These live here and
# NOT in package.json: pnpm 11 no longer reads the `pnpm` field of package.json, so
# an override placed there does nothing — it warns, but it does nothing.
overrides:
  'brace-expansion@<5.0.6': '>=5.0.6'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1'
  'postcss@<8.5.10': '>=8.5.10'
  'qs@>=6.11.1 <=6.15.1': '>=6.15.2'
  'sharp@<0.35.0': '>=0.35.0'
  'tmp@<0.2.6': '>=0.2.6'
  'ws@<8.20.1': '>=8.20.1'
