# Build scripts are denied by default; an unlisted package counts as unreviewed.
# `allowBuilds` is the only spelling pnpm 11 reads: onlyBuiltDependencies,
# neverBuiltDependencies and their siblings were removed in v11 and replaced by
# this map. Without an entry, `pnpm install` exits with ERR_PNPM_IGNORED_BUILDS
# rather than warning.
allowBuilds:
  # Reached only in watch mode: the native binding serves jest-haste-map's file watcher, and
  # nothing in CI runs watch mode — `test:watch` is a developer convenience no workflow calls.
  #
  # Denying costs nothing even for a developer who does use watch mode, because the install
  # script is a no-op unless it is asked for. `@parcel/watcher@2.6.0` runs
  # `node scripts/build-from-source.js`, whose entire body is:
  #
  #     if (process.env.npm_config_build_from_source === 'true') { build() }
  #
  # Unset, it compiles nothing and the package uses its prebuilt binaries. So `true` would not
  # buy a native build — it would only grant the script permission to act if that gate moves.
  #
  # The entry is kept whether or not the resolved tree contains the package: pnpm 11
  # EXITS on an unlisted build script, so the decision has to be on record BEFORE a dependency
  # bump introduces one, or that bump cannot install.
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  unrs-resolver: true

# Forced versions for vulnerable transitive dev dependencies. These live here and
# NOT in package.json: pnpm 11 no longer reads the `pnpm` field of package.json, so
# an override placed there does nothing — it warns, but it does nothing.
overrides:
  'brace-expansion@<5.0.6': '>=5.0.6'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1'
  'postcss@<8.5.10': '>=8.5.10'
  # GHSA-4mjr-xmp4-gh2g / GHSA-x5fp-wj9c-mxmx (CVSS 6.3) — denial of service.
  #
  # A BLANKET floor, replacing a range-targeted entry (`qs@>=6.11.1 <=6.15.1`) that had stopped
  # applying: the resolved version reached 6.15.3, left that window, and the override silently
  # ceased to match. A range-targeted override deactivates itself the moment its target moves,
  # while still reading in the config as protection. Floor the package, not a window of it.
  'qs': '^6.16.0'
  # GHSA-5jgf-p345-68v8 / f65p-4m7j-42xc / fph4-wmhf-6fwf / jqff-g426-hqxp (CVSS 7.5) — host
  # confusion in URI parsing. Transitive through `@stryker-mutator/core`, so dev-time only; floored
  # rather than ignored, because a scanner told to skip dev dependencies stays blind after this one.
  'fast-uri': '^3.1.6'
  'sharp@<0.35.0': '>=0.35.0'
  'tmp@<0.2.6': '>=0.2.6'
  'ws@<8.20.1': '>=8.20.1'
