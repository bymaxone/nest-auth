name: Size Limit

# Enforces the brotlied bundle-size budget declared in .size-limit.json for
# every published subpath. The job fails when any subpath exceeds its limit,
# so size regressions block merge. PR-only — pushing to main has no base ref
# to diff against, and the CI workflow already builds main on every push.
on:
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR when a new commit is pushed.
concurrency:
  group: size-limit-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only. No comment is posted to the PR — size-limit's
# own output in the job log is sufficient to identify which subpath blew
# its budget. (Removed `andresz1/size-limit-action` because it shells out to
# `npx size-limit` even when configured with `package_manager: pnpm`, which
# bypasses pnpm's isolated node_modules layout and can't see the installed
# `@size-limit/preset-small-lib`, producing "Unexpected end of JSON input".)
permissions:
  contents: read

jobs:
  size:
    name: Bundle size budget
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all subpaths
        run: pnpm build

      - name: Check bundle sizes against budget
        run: pnpm size
