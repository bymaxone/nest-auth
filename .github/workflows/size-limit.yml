name: Size Limit

# Compares the brotlied bundle size of every published subpath against the
# PR's base branch and posts a single rolling comment with the delta. The
# job fails if any subpath exceeds the budget declared in .size-limit.json,
# so size regressions block merge — but only on PRs (no point running this
# on push to main where there's no base to diff against).
on:
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR when a new commit is pushed.
concurrency:
  group: size-limit-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read the repo, write a comment on the PR. No other scopes.
permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    name: Bundle size delta vs base
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      # The action checks out and builds the base branch + the PR branch
      # internally, runs size-limit on both, and posts a single PR comment
      # with the diff. `package_manager: pnpm` is required because the
      # default is npm and the lockfile here is pnpm-lock.yaml.
      - name: Size Limit
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: pnpm
          build_script: build
