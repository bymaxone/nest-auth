# Keeps the shared half of AGENTS.md in step with the canonical copy in
# bymaxone/.github. The rules that must not vary between Bymax repositories are
# edited there; everything this repository writes for itself lives outside the
# markers and is never touched.
#
# Codex reads AGENTS.md from the file tree of the repository under review, so a
# shared rule has to exist as a real file here rather than be referenced. That is
# why this is a sync and not a `uses:` — the reusable CI above it propagates by
# reference, this one has to propagate by commit.
name: agents-sync

on:
  schedule:
    # Weekly, off the hour and on a different day from the OSV scan so the two
    # scheduled runs do not cluster.
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    # Referenced by the moving alias rather than pinned, which is the convention
    # for first-party reusables and the rule the shared block itself states.
    # Pinning a SHA here would stop the sync moving when the canonical rules do,
    # which defeats the only thing this workflow exists to do.
    uses: bymaxone/.github/.github/workflows/agents-sync.yml@v1
    permissions:
      contents: write
      pull-requests: write
    secrets:
      # A GitHub App rather than a long-lived token, which is what the called
      # workflow prefers: it mints an installation token per run that expires
      # within the hour, so there is no credential to rotate and none that can
      # expire unnoticed and leave the sync quietly using the default token.
      #
      # This replaces a `sync-token: ${{ secrets.AGENTS_SYNC_TOKEN }}` mapping
      # whose secret no longer exists. An absent secret evaluates to the empty
      # string, the called workflow falls through to the default token, and the
      # run then fails at the point it tries to open the pull request:
      # `GitHub Actions is not permitted to create or approve pull requests`.
      # Nothing about the mapping said it was dead, which is why this sat broken.
      #
      # Both are organisation secrets with `visibility: all`, so this repository
      # already reads them and nothing has to be configured here. They are named
      # rather than passed with `inherit`, so the called workflow receives these
      # two and not every secret this repository holds.
      #
      # Why a non-default credential is needed at all: a pull request opened with
      # the default GITHUB_TOKEN starts no workflow runs, and this repository's
      # ruleset requires status checks — so an unattended sync pull request could
      # never merge.
      #
      # The pair is read together; supplying one alone is a misconfiguration the
      # called workflow reports before falling back.
      app-id: ${{ secrets.AGENTS_SYNC_APP_ID }}
      app-private-key: ${{ secrets.AGENTS_SYNC_PRIVATE_KEY }}
