# CI — thin caller of the org-wide reusable pipeline (bymaxone/.github).
#
# The generic library jobs (lint, typecheck, unit+coverage, mutation) run via
# node-lib-ci.yml. This library's build-output integrity across its five subpaths
# and the bundle-size budget stay here. Mutation runs only on a push to main /
# manual dispatch, never on PRs.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Conditional, because a caller's block cancels the whole run — including the jobs the
  # reusable contributes — regardless of what the reusable declares. Superseding is right on a
  # branch and wrong here: the mutation gate runs only on the default branch, takes over an hour
  # cold, and any merge inside that window would end it. #77's run was killed at 15 minutes by
  # the merge of #78, so that commit has no mutation verdict and the incremental baseline it
  # would have written was never saved. See bymaxone/.github#27 for the same change upstream.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  ci:
    uses: bymaxone/.github/.github/workflows/node-lib-ci.yml@v1
    with:
      run-format-check: true # runs `pnpm format:check` (prettier --check .) as a hard gate
      run-build: false # build + integrity + size verified in the `verify` job below
      unit-command: pnpm test:cov:all
      run-mutation: true
      mutation-source-globs: '^(src/)'
      # A cold run does not fit the shared 45-minute default and was being cancelled on every
      # push to main, so the gate produced nothing. This library keeps `ignoreStatic: false`
      # deliberately — that is how it caught a refresh cookie shipping `httpOnly: false` — and
      # Stryker reports the 443 static mutants that choice keeps in scope as 6% of the total
      # but 83% of the time. 120 rather than a tighter number on purpose: a completed run is
      # what tells us the real duration, and undershooting costs another cancelled hour.
      mutation-timeout-minutes: 120

  # Library-specific verification: full build, output integrity across every
  # subpath, and the brotli bundle-size budget.
  verify:
    name: Verify build + size
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the published-surface gate cross-checks every `v*.*.*` tag
      # against a CHANGELOG section, and a shallow clone has no tags to find —
      # the check would pass by having nothing to compare.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Build all subpaths
        run: pnpm build
      - name: Verify build output integrity
        run: |
          for subpath in server shared client react nextjs; do
            for ext in mjs cjs d.ts d.cts; do
              if [ ! -f "dist/$subpath/index.$ext" ]; then
                echo "Missing dist/$subpath/index.$ext"
                exit 1
              fi
            done
          done
          echo "All 5 subpaths produced ESM + CJS + .d.ts + .d.cts"
      - name: Bundle size budget
        run: pnpm size
      - name: Type resolution across module systems
        run: pnpm check:exports
      - name: Load every subpath from the tarball (ESM + CJS)
        run: pnpm check:runtime
      - name: Documentation matches the built package
        run: pnpm check:published
      # A source file over 800 lines is a finding unless it is on the frozen baseline, which can only
      # shrink. On a pull request the baseline is also compared with the base branch's, so a change
      # cannot admit the offender it adds by editing the list.
      - name: Source files stay within 800 lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/check-file-length.mjs --base "origin/$BASE_REF"
          else
            node scripts/check-file-length.mjs
          fi
      # An `x as unknown as T` tells the compiler to stop checking, which AGENTS.md lists as a
      # blocking finding. The repository's existing sites are on a frozen baseline that can only
      # shrink; a new site fails, and on a pull request the baseline is compared with the base
      # branch's so a change cannot admit the site it adds by editing the list.
      - name: No new double assertions through unknown
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/check-double-assertions.mjs --base "origin/$BASE_REF"
          else
            node scripts/check-double-assertions.mjs
          fi

      # AGENTS.md caps a function or a test body at 50 lines and the review reports a new one as a
      # blocking finding. The repository's existing offenders are on a frozen baseline that can
      # only shrink, generated by the script and never edited by hand; on a pull request the
      # baseline is compared with the base branch's so a change cannot admit the function it adds.
      - name: No new function or test body over 50 lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/check-function-length.mjs --base "origin/$BASE_REF"
          else
            node scripts/check-function-length.mjs
          fi

  # The Lua scripts behind refresh rotation, revocation, claims and rate limits run here against
  # a real Redis 8 started by Testcontainers (the image is pinned by digest in
  # `test/e2e/real-redis/redis-container.ts`). The default e2e run uses `ioredis-mock`, which only
  # approximates them. The list of suites, and why each is on it, is in `jest.e2e.redis.config.ts`.
  e2e-redis:
    name: E2E (Testcontainers · Redis 8)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The install step below runs the repository's own scripts; the token must not stay
          # in the repository's git configuration for them to read.
          persist-credentials: false
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: End-to-end tests against a real Redis
        run: pnpm test:e2e:redis

  security:
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high

  # Single check the org ruleset can require, in every repo, under one name.
  #
  # A required status check is matched by literal name, and this repo's jobs are
  # named nothing like the next repo's — so there is no list of contexts that
  # works org-wide. One aggregate per repo, always spelled `CI passed`, is what
  # makes a single rule at the organisation level possible, and what makes every
  # repository created from now on inherit the gate without being configured.
  #
  # `always()` is what makes this a gate rather than decoration: without it the
  # job is skipped the moment a dependency fails, and a skipped check reports
  # neutral — the pull request would look unblocked precisely when it is broken.
  # `cancelled` is named explicitly for the same reason; a cancelled job is not
  # a passing one, and a queue timeout produces exactly that.
  #
  # A skipped dependency is accepted on purpose: jobs here are conditional on the
  # event, and failing on skip would break every push that legitimately runs a
  # subset.
  ci-pass:
    name: CI passed
    if: always()
    needs: [ci, verify, e2e-redis, security]
    runs-on: ubuntu-latest
    # Once this is the required check, a hung runner holds every merge behind it
    # for GitHub's default of six hours. The job is one comparison, so a short
    # ceiling costs nothing and bounds that.
    timeout-minutes: 5
    steps:
      # Printed on success as well as failure. Without it the check reports a bare
      # red X and the reader has to open each dependency to find which one broke.
      - name: Report the result of every dependency
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' | sort
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Named for what the condition does: `skipped` is deliberately not a failure
      # here, so "did not succeed" would describe a stricter gate than this is.
      - name: Fail when any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
