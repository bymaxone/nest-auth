name: Release

# Tag-driven release. Pushing a `v*.*.*` tag kicks off the publish flow; the
# `workflow_dispatch` trigger is kept so an interrupted release can be re-run
# manually from the Actions tab when needed.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

# A release is a destructive, shared-state operation — only one at a time.
concurrency:
  group: release
  cancel-in-progress: false

# Default to read-only at the workflow level. The publish job widens to
# `contents: write` (for the GitHub Release) and `id-token: write` (for
# the OIDC trusted publisher exchange).
permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm and create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The `npm-publish` environment gates the run behind a manual approval
    # (configured in repo Settings → Environments). Even an accidentally
    # pushed tag cannot publish without a reviewer clicking "Approve".
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@bymax-one/nest-auth

    # Required for npm OIDC trusted publishing (`id-token: write`) and for
    # `gh release create` (`contents: write`). No `NPM_TOKEN` secret needed —
    # the publish exchanges the GitHub OIDC token for a short-lived npm
    # credential through the Trusted Publisher registered on npmjs.com.
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        # Guards against publishing a tag whose semver does not match the
        # version committed to package.json — a mismatch always indicates
        # a broken release and would otherwise ship the wrong metadata.
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Verify (typecheck · lint · test · build · packaging gates)
        # `prepublishOnly` carries every gate, including the three that inspect the
        # packed artifact rather than the source tree: `check:exports` resolves each
        # entry point the way every resolution mode does, `check:runtime` loads them
        # from the tarball in ESM and CommonJS, and `check:published` compiles the
        # README against `dist/`. Running it as an explicit step is what gates this
        # job — the publish below passes `--ignore-scripts`, so npm does not run it
        # a second time and rebuild the `dist/` these gates just validated.
        run: pnpm prepublishOnly

      - name: Publish to npm with provenance
        # `npm publish`, not `pnpm publish`. The registry's `readme` field is
        # populated from the publish request, and pnpm 11 does not send it — every
        # package in this family published under pnpm 11 carries an empty `readme`,
        # which renders the npm page with no documentation at all. It already cost
        # this family two corrective patch releases.
        #
        # Authentication is OIDC trusted publishing: the npm CLI exchanges the
        # GitHub OIDC token (`id-token: write` above) for a short-lived publish
        # credential, so no token secret is involved. `--access public` replaces
        # pnpm's `--no-git-checks`; npm performs no git check on publish, and the
        # scope needs an explicit public access flag.
        #
        # `--ignore-scripts`: npm runs `prepublishOnly` on publish, and this job
        # already ran it as its own step. Without the flag it runs twice, and the
        # second run rebuilds the `dist/` the gates just validated.
        run: npm publish --provenance --access public --ignore-scripts

      - name: Extract release notes from CHANGELOG
        # Pulls the section for the current tag out of CHANGELOG.md so the
        # GitHub Release body stays in sync with the changelog. Falls back
        # to "See CHANGELOG.md" when the section is not found.
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](./CHANGELOG.md) for details."
          fi
          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # Notes are passed via env var (NOT `${{ ... }}` interpolation) so that
        # backticks, `$()`, and other shell metacharacters inside the CHANGELOG
        # cannot be evaluated by bash — a script-injection vector that would
        # otherwise let CHANGELOG content execute arbitrary commands on the
        # runner with the same token scope as this job.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$RELEASE_NOTES"
